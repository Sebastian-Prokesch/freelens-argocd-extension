# Dummy repository Secret so the Config page has something to list.
# Points at the public example-apps repo (no credentials required for clone).
apiVersion: v1
kind: Secret
metadata:
  name: demo-example-apps-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
    freelens.dev/demo: "true"
type: Opaque
stringData:
  type: git
  url: https://github.com/argoproj/argocd-example-apps.git
  project: freelens-demo
  name: argocd-example-apps
---
# Dummy cluster Secret for Config page coverage (in-cluster is already known to Argo CD).
apiVersion: v1
kind: Secret
metadata:
  name: demo-example-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    freelens.dev/demo: "true"
type: Opaque
stringData:
  name: demo-example-cluster
  # Intentionally not a real API endpoint — Config page listing only
  server: https://demo-cluster.invalid:6443
  project: freelens-demo
  config: |
    {
      "tlsClientConfig": {
        "insecure": true
      }
    }
